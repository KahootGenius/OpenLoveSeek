<text x="810" y="60.205" font-size="11.5" text-anchor="middle" fill="currentColor" font-weight="600">now · ordinary reply</text>
<text x="810" y="76.075" font-size="10.5" text-anchor="middle" fill="currentColor">read receipt in 3–45 seconds</text>
<rect x="680" y="127" width="260" height="48" rx="6" stroke="#f0784a" stroke-width="2" fill="#f0784a" fill-opacity="0.09"/>
<text x="810" y="147.205" font-size="11.5" text-anchor="middle" fill="currentColor" font-weight="600">short · one line now: “busy, later”</text>
<text x="810" y="163.075" font-size="10.5" text-anchor="middle" fill="currentColor">full reply lands when the slot ends</text>
<text x="810" y="192" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.65">the full reply is written now, delivered later</text>
<rect x="680" y="262" width="260" height="56" rx="6" stroke="currentColor" stroke-width="1.2" fill="currentColor" fill-opacity="0.06"/>
<text x="810" y="278.27" font-size="11.5" text-anchor="middle" fill="currentColor" font-weight="600">defer · nothing now</text>
<text x="810" y="294.14" font-size="10.5" text-anchor="middle" fill="currentColor">full reply lands at wake-up + 3–20 min,</text>
<text x="810" y="310.01" font-size="10.5" text-anchor="middle" fill="currentColor">or slot end + 1–5 min</text>
<line x1="20" y1="334" x2="940" y2="334" stroke="currentColor" stroke-width="1" opacity="0.2"/>
<text x="20" y="354" font-size="10.5" text-anchor="start" fill="currentColor" opacity="0.85">Read receipts are stamped when the user sends: free +3–45 s · busy within 3–15 min, by the slot&#x27;s end · asleep at wake-up +2–10 min.</text>
<text x="20" y="370" font-size="10.5" text-anchor="start" fill="currentColor" opacity="0.85">A deferred reply is written immediately under a “you just got free” directive, then handed to the scheduled-message store with an OS notification.</text>
<text x="20" y="386" font-size="10.5" text-anchor="start" fill="currentColor" opacity="0.85">It folds into the chat at its time with no trigger row and is never treated as stale.</text>
<text x="20" y="404" font-size="10.5" text-anchor="start" fill="currentColor" font-weight="600" opacity="0.65" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">A WORKED DAY · sleep 23:30–07:00 · work 09:00–18:00</text>
