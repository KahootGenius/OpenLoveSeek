<text x="496" y="141" font-size="11" text-anchor="middle" fill="currentColor" paint-order="stroke" stroke="#0d1117" stroke-width="5" stroke-linejoin="round">busy</text>
<text x="420" y="212" font-size="10" text-anchor="start" fill="currentColor" opacity="0.7">busy = work, meetings, class,</text>
<text x="420" y="226" font-size="10" text-anchor="start" fill="currentColor" opacity="0.7">gym, shower, cooking, …</text>
<polygon points="578,111 648,151 578,191 508,151" fill="currentColor" fill-opacity="0.045" stroke="currentColor" stroke-width="1.2"/>
