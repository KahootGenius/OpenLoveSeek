<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 578" width="960" height="578" role="img" aria-label="Rhythm: with a schedule, her current activity decides between an ordinary reply, one short busy line now with the full reply at the slot&#x27;s end, or silence until she wakes" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" color="#e6edf3" fill="currentColor">
<title>Rhythm: with a schedule, her current activity decides between an ordinary reply, one short busy line now with the full reply at the slot&#x27;s end, or silence until she wakes</title>
