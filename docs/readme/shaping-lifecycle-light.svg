<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" width="960" height="456" role="img" aria-label="Lifecycle of one style dimension: the probing variant is settled, excluded or rotated by the perception verdict; one candidate left settles automatically, none left skips" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" color="#1f2328" fill="currentColor">
<title>Lifecycle of one style dimension: the probing variant is settled, excluded or rotated by the perception verdict; one candidate left settles automatically, none left skips</title>
<rect width="960" height="456" fill="#ffffff"/>
<defs><marker id="life-arr-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="life-arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db0"/></marker><marker id="life-arr-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#11806a"/></marker><marker id="life-arr-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9481b"/></marker></defs>
<text x="20" y="26" font-size="11" text-anchor="start" fill="currentColor" opacity="0.8">Verdicts (likes / dislikes / neutral) come from the perception call and grade lastActed, the variant she actually acted.</text>
<rect x="30" y="160" width="130" height="64" rx="6" stroke="currentColor" stroke-width="1.2" fill="none"/>
<text x="95" y="180.27" font-size="11.5" text-anchor="middle" fill="currentColor" font-weight="600">Dimension open</text>
<text x="95" y="196.14" font-size="10.5" text-anchor="middle" fill="currentColor">not settled,</text>
<text x="95" y="212.01" font-size="10.5" text-anchor="middle" fill="currentColor">not skipped</text>
<rect x="210" y="150" width="180" height="84" rx="8" stroke="#c9481b" stroke-width="2.2" fill="#c9481b" fill-opacity="0.09"/>
<text x="300" y="172" font-size="13" text-anchor="middle" fill="currentColor" font-weight="700">Probing</text>
<text x="300" y="190" font-size="11" text-anchor="middle" fill="currentColor">acts variant Vi</text>
<text x="300" y="205" font-size="11" text-anchor="middle" fill="currentColor">turns +1 each turn</text>
<text x="300" y="221" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.8">turn close: lastActed = Vi</text>
<polygon points="550,150 625,192 550,234 475,192" fill="currentColor" fill-opacity="0.045" stroke="currentColor" stroke-width="1.2"/>
<text x="550" y="188.81" font-size="11" text-anchor="middle" fill="currentColor">exclude Vi;</text>
<text x="550" y="203.11" font-size="11" text-anchor="middle" fill="currentColor">candidates left?</text>
<rect x="710" y="30" width="170" height="64" rx="8" stroke="currentColor" stroke-width="1.2" fill="currentColor"/>
<text x="795" y="52" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="700">Settled</text>
<text x="795" y="68" font-size="9.5" text-anchor="middle" fill="#ffffff" opacity="0.85">restated in the guide every turn;</text>
<text x="795" y="82" font-size="9.5" text-anchor="middle" fill="#ffffff" opacity="0.85">the probe moves to the next one</text>
<rect x="710" y="290" width="170" height="64" rx="8" stroke="currentColor" stroke-width="1.2" fill="none" stroke-dasharray="5 4"/>
<text x="795" y="312" font-size="13" text-anchor="middle" fill="currentColor" font-weight="700">Skipped</text>
<text x="795" y="328" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.8">the probe moves on;</text>
<text x="795" y="342" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.8">the dimension stays open</text>
<polyline points="160,192 210,192" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#life-arr-k)"/>
<text x="185" y="176" font-size="9.5" text-anchor="middle" fill="currentColor" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">first</text>
<text x="185" y="186" font-size="9.5" text-anchor="middle" fill="currentColor" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">candidate</text>
<polyline points="370,150 370,62 710,62" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#life-arr-k)"/>
<text x="540" y="57" font-size="11" text-anchor="middle" fill="currentColor" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">likes → settle</text>
<polyline points="390,192 475,192" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#life-arr-k)"/>
<text x="432" y="181" font-size="11" text-anchor="middle" fill="currentColor" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">dislikes</text>
<polyline points="550,150 550,88 710,88" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#life-arr-k)"/>
<text x="630" y="83" font-size="11" text-anchor="middle" fill="currentColor" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">1 left → auto-settle</text>
<polyline points="625,192 670,192 670,322 710,322" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#life-arr-k)"/>
<text x="678" y="262" font-size="11" text-anchor="start" fill="currentColor" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">0 left</text>
<text x="678" y="277" font-size="11" text-anchor="start" fill="currentColor" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">→ skip</text>
<polyline points="550,234 550,275 360,275 360,234" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#life-arr-k)"/>
<text x="490" y="291" font-size="11" text-anchor="middle" fill="currentColor" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">≥2 left → switch to an untried one now</text>
<path d="M 232,150 C 232,104 340,104 340,150" fill="none" stroke="#c9481b" stroke-width="1.4" marker-end="url(#life-arr-v)"/>
<text x="286" y="112" font-size="10" text-anchor="middle" fill="#c9481b" font-weight="600" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">3 turns, no verdict, untried left → rotate</text>
<path d="M 232,234 C 232,282 310,282 310,234" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#life-arr-k)"/>
<text x="290" y="299" font-size="10" text-anchor="middle" fill="currentColor" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">neutral → keep acting</text>
<polyline points="220,234 220,380 795,380 795,354" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#life-arr-k)"/>
<text x="548" y="395" font-size="11" text-anchor="middle" fill="currentColor" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">3 turns, no verdict, nothing untried → skip</text>
<polyline points="845,290 845,94" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#life-arr-k)"/>
<text x="853" y="186" font-size="10" text-anchor="start" fill="currentColor">a later</text>
<text x="853" y="200" font-size="10" text-anchor="start" fill="currentColor">likes still</text>
<text x="853" y="214" font-size="10" text-anchor="start" fill="currentColor" opacity="0.75">settles it</text>
<line x1="20" y1="414" x2="940" y2="414" stroke="currentColor" stroke-width="1" opacity="0.2"/>
<text x="20" y="432" font-size="10.5" text-anchor="start" fill="currentColor" opacity="0.8">After a settle or skip the probe moves to the next open dimension; when all five are settled or skipped, her guide says “keep who you are now”.</text>
<text x="20" y="448" font-size="10" text-anchor="start" fill="currentColor" opacity="0.55" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">shaping.ts · applyJudgement / advanceTurn</text>
</svg>