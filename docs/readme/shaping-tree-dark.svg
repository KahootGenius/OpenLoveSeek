<text x="550" y="163" font-size="10" text-anchor="middle" fill="#f0784a" font-weight="600">acting · turn 2 of 3</text>
<rect x="480" y="184" width="140" height="44" rx="6" stroke="currentColor" stroke-width="1.2" fill="none"/>
<text x="550" y="203" font-size="12" text-anchor="middle" fill="currentColor">Goes along</text>
<text x="550" y="219" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.6">untried · next in line</text>
<rect x="636" y="128" width="140" height="44" rx="6" stroke="currentColor" stroke-width="1.2" fill="none"/>
<text x="706" y="147" font-size="12" text-anchor="middle" fill="currentColor">Direct</text>
