<text x="328.3" y="370" font-size="11" text-anchor="start" fill="currentColor">excluded (disliked)</text>
<rect x="453.78" y="358" width="26" height="16" rx="4" stroke="#f0784a" stroke-width="2" fill="#f0784a" fill-opacity="0.09"/>
<text x="487.78" y="370" font-size="11" text-anchor="start" fill="currentColor">being probed</text>
<rect x="581.91" y="358" width="26" height="16" rx="4" stroke="currentColor" stroke-width="1.2" fill="none"/>
<text x="615.91" y="370" font-size="11" text-anchor="start" fill="currentColor">open</text>
<rect x="670.11" y="358" width="26" height="16" rx="4" stroke="currentColor" stroke-width="0.8" fill="none" opacity="0.35"/>
<text x="704.11" y="370" font-size="11" text-anchor="start" fill="currentColor">never reached</text>
<text x="14" y="408" font-size="11" text-anchor="start" fill="currentColor" opacity="0.82">Code, not the model, picks the probe: the first open dimension from left to right, one variant at a time, for at most three turns.</text>
<text x="14" y="426" font-size="11" text-anchor="start" fill="currentColor" opacity="0.82">The character only acts the variant. A separate cheap call judges the user&#x27;s reaction: liked settles it, disliked excludes it.</text>
<text x="14" y="444" font-size="11" text-anchor="start" fill="currentColor" opacity="0.82">Settled styles are restated in her guide every turn. The state is plain data (shaping.ts); this snapshot is an example, not a script.</text>
<text x="14" y="484" font-size="10" text-anchor="start" fill="currentColor" opacity="0.55" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">shaping.ts · STYLE_TREE / nextProbe / ShapingState</text>
</svg>