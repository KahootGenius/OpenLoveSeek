<text x="20" y="506" font-size="11" text-anchor="start" fill="currentColor" opacity="0.8">Position is precedence: when rules conflict, the higher lane wins. The core rules sit above the persona, so a long persona cannot out-vote them.</text>
<text x="20" y="524" font-size="11" text-anchor="start" fill="currentColor" opacity="0.8">Proactive messages reuse the same lanes and the same evidence fence. Group chats have their own pipeline.  ·  prompt-envelope.ts</text>
